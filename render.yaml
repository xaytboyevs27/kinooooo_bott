services:
  - type: worker
    name: kinooooo-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python kinosave.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPERADMIN_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
